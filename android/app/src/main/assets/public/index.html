<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera Geotag</title>
<style>
:root{--bg:#f2f4f7;--cd:#fff;--tx:#17202a;--mu:#667085;--ac:#0f766e;--bd:#dde1e7}
@media(prefers-color-scheme:dark){:root{--bg:#101316;--cd:#1a2026;--tx:#eceff3;--mu:#97a1ad;--ac:#2dd4bf;--bd:#2b333b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(84px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.w{max-width:1100px;margin:0 auto;padding:10px}
h1{font-size:18px;margin:2px 0 10px}
.g{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(orientation:landscape) and (min-width:620px){.g{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pv{position:sticky;top:8px;align-self:start}}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.seg button{padding:10px 4px;font-size:13px;background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=datetime-local],textarea,select{width:100%;padding:10px;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{min-height:64px;resize:vertical}
.k{display:flex;align-items:center;gap:8px;margin:8px 0}
.k input{width:20px;height:20px}
.r{display:flex;gap:8px}.r>*{flex:1}
button{border:0;border-radius:10px;padding:11px;font:inherit;font-weight:600;background:var(--ac);color:#fff}
button.s{background:var(--bd);color:var(--tx)}
button:disabled{opacity:.5}
.i{font-size:13px;color:var(--mu);margin:0 0 6px}
.pr{white-space:pre-wrap;font-size:13px;background:#000a;color:#fff;border-radius:8px;padding:8px;margin-top:8px}
.im{background:#000;border-radius:10px;min-height:140px;display:flex;align-items:center;justify-content:center;color:#889}
#hasil{max-width:100%;max-height:calc(100vh - 220px);display:none;border-radius:10px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--cd);border-top:1px solid var(--bd)}
.bar button{width:100%;max-width:1076px;display:block;margin:0 auto;font-size:17px;padding:14px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:10px;padding:10px 12px;text-align:center;display:none;z-index:9}
.h{display:none}
button,select,input{touch-action:manipulation}
#err{position:fixed;top:0;left:0;right:0;z-index:99;background:#b00020;color:#fff;font-size:12px;padding:6px 10px;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div class="w">
<h1>📍 Kamera Geotag</h1>
<div class="g">
<div class="cl">
  <div class="seg" id="seg">
    <button data-m="normal">Foto Normal<br>(data asli)</button>
    <button data-m="kamera">Kamera<br>Custom</button>
    <button data-m="galeri">Galeri<br>Custom</button>
  </div>
  <div class="c">
    <p class="i" id="info"></p>
    <label>Judul foto (opsional)</label>
    <input type="text" id="judul" placeholder="cth: Survei Jalan Usaha Tani">

    <div id="boxNormal">
      <div class="i" id="gpsSt" style="margin-top:10px">GPS: belum dicek</div>
      <button class="s" id="btnGps" style="width:100%">🔄 Cek GPS &amp; Alamat</button>
    </div>

    <div id="boxCustom" class="h">
      <label>Koordinat</label>
      <input type="text" id="koor" placeholder="-7.812345, 110.912345" inputmode="text">
      <label>Alamat / keterangan lokasi</label>
      <textarea id="alamat" placeholder="Dusun, Desa, Kecamatan, Kabupaten"></textarea>
      <button class="s" id="btnIsi" style="width:100%;margin-top:6px">📍 Isi koordinat &amp; alamat dari GPS</button>
      <label>Ketinggian (mdpl) &middot; kosong = otomatis dari koordinat</label>
      <input type="text" id="ket" inputmode="decimal" placeholder="756">
      <label>Arah</label>
      <div class="r"><input type="text" id="arah" placeholder="120° Tenggara"><button class="s" id="btnArah" style="flex:0 0 auto">🧭 Kompas</button></div>
      <label>Tanggal &amp; jam</label>
      <select id="tglMode">
        <option value="now">Otomatis (saat ini)</option>
        <option value="file">Sesuai waktu file foto</option>
        <option value="manual">Atur manual</option>
      </select>
      <input type="datetime-local" id="tglVal" class="h" style="margin-top:6px" step="1">
    </div>
  </div>

  <div class="c">
    <b>Tampilkan di watermark</b>
    <div class="i">Centang bagian yang ingin muncul.</div>
    <div class="k"><input type="checkbox" id="tMap" checked><span>Peta lokasi (butuh internet)</span></div>
    <div class="k"><input type="checkbox" id="tJudul" checked><span>Judul</span></div>
    <div class="k"><input type="checkbox" id="tAlamat" checked><span>Alamat</span></div>
    <div class="k"><input type="checkbox" id="tKoor" checked><span>Koordinat</span></div>
    <div class="k"><input type="checkbox" id="tWaktu" checked><span>Tanggal &amp; jam</span></div>
    <div class="k"><input type="checkbox" id="tKet" checked><span>Ketinggian</span></div>
    <div class="k"><input type="checkbox" id="tArah" checked><span>Arah (kompas)</span></div>
    <div class="r">
      <div><label>Jenis peta</label><select id="mapStyle"><option value="osm">Jalan</option><option value="sat">Satelit</option></select></div>
      <div><label>Zoom peta</label><select id="mapZoom"><option value="15">Jauh</option><option value="16">Sedang</option><option value="17" selected>Dekat</option><option value="18">Sangat dekat</option></select></div>
    </div>
    <div class="r">
      <div><label>Posisi</label><select id="posisi"><option value="bawah">Bawah</option><option value="atas">Atas</option></select></div>
      <div><label>Ukuran teks</label><select id="ukuran"><option value="0.75">Kecil</option><option value="1" selected>Sedang</option><option value="1.35">Besar</option></select></div>
    </div>
    <div class="k" style="margin-top:12px"><input type="checkbox" id="auto" checked><span>Simpan otomatis ke galeri</span></div>
    <div class="pr" id="pr"></div>
  </div>
</div>

<div class="pv">
  <div class="c">
    <div class="im" id="im"><span id="kosong">Hasil foto tampil di sini</span><img id="hasil" alt="Hasil"></div>
    <div class="i" id="st" style="margin-top:8px"></div>
    <div class="r">
      <button class="s" id="btnSimpan" disabled>💾 Simpan ke Galeri</button>
      <button class="s" id="btnBagi" disabled>↗ Bagikan</button>
    </div>
  </div>
</div>
</div>
</div>

<div class="bar"><button id="go">📷 Ambil Foto</button></div>
<div id="toast"></div>
<div id="err"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" multiple hidden>

<script>
function showErr(m){var b=document.getElementById('err');if(b){b.style.display='block';b.textContent=m}}
window.addEventListener('error',function(e){showErr('Error: '+e.message+' (baris '+e.lineno+')')});
window.addEventListener('unhandledrejection',function(e){showErr('Error: '+(e.reason&&e.reason.message||e.reason))});
</script>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MAXSIDE=2560;
const native=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
let GS=null;try{if(native)GS=Capacitor.registerPlugin('GallerySaver')}catch(e){}
let mode='normal',pending=null,lastPos=null,lastAddr=null,lastBlob=null,lastSaved=true,lastUrl=null,busy=false;

/* ---------- pengaturan ---------- */
const KEYS=['judul','koor','alamat','tJudul','tKoor','tAlamat','tWaktu','tKet','tArah','ket','arah','tMap','mapStyle','mapZoom','posisi','ukuran','auto','tglMode'];
function save(){try{const s={mode};KEYS.forEach(k=>{const e=$(k);s[k]=e.type==='checkbox'?e.checked:e.value});localStorage.setItem('geotag2',JSON.stringify(s))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('geotag2')||'{}');if(s.mode)mode=s.mode;KEYS.forEach(k=>{if(!(k in s))return;const e=$(k);e.type==='checkbox'?e.checked=s[k]:e.value=s[k]})}catch(e){}}

/* ---------- util ---------- */
const p2=n=>String(n).padStart(2,'0');
function fmt(d){const z=-d.getTimezoneOffset(),zn={420:'WIB',480:'WITA',540:'WIT'}[z]||('GMT'+(z>=0?'+':'-')+Math.abs(z/60));
 return d.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+' '+zn}
function localISO(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function dist(a,b){const dx=(a.longitude-b.longitude)*111320*Math.cos(a.latitude*Math.PI/180),dy=(a.latitude-b.latitude)*110540;return Math.hypot(dx,dy)}

/* ---------- GPS & alamat asli ---------- */
function getPos(){return new Promise(res=>{
 if(!navigator.geolocation)return res(lastPos);
 navigator.geolocation.getCurrentPosition(p=>{lastPos={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,altitude:p.coords.altitude};res(lastPos)},
  ()=>res(lastPos),{enableHighAccuracy:true,maximumAge:10000,timeout:12000})})}
async function addrFor(c){
 if(lastAddr&&dist(c,lastAddr.c)<30)return lastAddr.t;
 const ac=new AbortController(),t=setTimeout(()=>ac.abort(),7000);
 try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=id&lat='+c.latitude+'&lon='+c.longitude,{signal:ac.signal});
  const j=await r.json();const a=j.display_name||'';if(a)lastAddr={c:{latitude:c.latitude,longitude:c.longitude},t:a};return a}
 catch(e){return ''}finally{clearTimeout(t)}}
const koorTxt=(c,acc)=>c.latitude.toFixed(6)+', '+c.longitude.toFixed(6)+(acc?' (±'+Math.round(c.accuracy)+' m)':'');
async function realData(){
 const c=await getPos();
 if(!c)return {koor:'GPS tidak tersedia',alamat:''};
 const a=await addrFor(c);
 let alt=c.altitude!=null?c.altitude:null;if(alt==null&&$('tKet').checked)alt=await elevFor({lat:c.latitude,lon:c.longitude});
 return {koor:koorTxt(c,1),alamat:a||'(alamat tidak tersedia, periksa internet)',c,alt};
}
async function cekGps(){
 $('gpsSt').textContent='GPS: mencari lokasi…';
 const d=await realData();
 $('gpsSt').textContent='GPS: '+d.koor+(d.alamat?'\nAlamat: '+d.alamat:'');
 $('gpsSt').style.whiteSpace='pre-wrap';preview();
}
async function isiDariGps(){
 toast('Mencari lokasi… arahkan HP ke objek');const hp=readHeading(600),c=await getPos();
 if(!c){toast('GPS tidak tersedia. Izinkan lokasi.');return}
 const hd=await hp;if(hd!=null)$('arah').value=fArah(hd);
 $('koor').value=koorTxt(c,0);const a=await addrFor(c);
 if(a)$('alamat').value=a;else toast('Alamat butuh internet; isi manual.');
 if(c.altitude!=null)$('ket').value=Math.round(c.altitude);else{const e=await elevFor({lat:c.latitude,lon:c.longitude});if(e!=null)$('ket').value=Math.round(e)}
 save();preview();
}


/* ---------- ketinggian & arah ---------- */
let elevC={k:'',v:null};
async function elevFor(ll){
 const k=ll.lat.toFixed(4)+','+ll.lon.toFixed(4);if(elevC.k===k)return elevC.v;
 const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
 try{const r=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+ll.lat+'&longitude='+ll.lon,{signal:ac.signal});
  const j=await r.json(),v=j.elevation&&j.elevation[0];if(typeof v==='number'){elevC={k,v};return v}return null}
 catch(e){return null}finally{clearTimeout(t)}}
function compass(a,b,g){const d=Math.PI/180,x=b*d,y=g*d,z=a*d,cY=Math.cos(y),cZ=Math.cos(z),sX=Math.sin(x),sY=Math.sin(y),sZ=Math.sin(z),
 Vx=-cZ*sY-sZ*sX*cY,Vy=-sZ*sY+cZ*sX*cY;if(Math.hypot(Vx,Vy)<0.15)return null;return (Math.atan2(Vx,Vy)/d+360)%360}
function readHeading(ms){return new Promise(res=>{
 if(!('ondeviceorientationabsolute' in window))return res(null);
 const S=[],f=e=>{if(e.alpha==null||e.beta==null||e.gamma==null)return;const h=compass(e.alpha,e.beta,e.gamma);if(h!=null)S.push(h)};
 window.addEventListener('deviceorientationabsolute',f,true);
 setTimeout(()=>{window.removeEventListener('deviceorientationabsolute',f,true);if(!S.length)return res(null);
  let sx=0,sy=0;S.forEach(h=>{sx+=Math.cos(h*Math.PI/180);sy+=Math.sin(h*Math.PI/180)});res((Math.atan2(sy,sx)*180/Math.PI+360)%360)},ms||500)})}
const DIR=['Utara','Timur Laut','Timur','Tenggara','Selatan','Barat Daya','Barat','Barat Laut'];
const fArah=v=>typeof v==='number'?(Math.round(v)%360)+'° '+DIR[Math.round(v/45)%8]:String(v);
const fAlt=v=>typeof v==='number'?Math.round(v)+' mdpl':(/^-?\d+([.,]\d+)?$/.test(String(v))?v+' mdpl':String(v));
let pendH=null;

/* ---------- baris watermark ---------- */
function fileTime(f,strict){const lm=f&&f.lastModified;if(lm&&(!strict||Math.abs(Date.now()-lm)<600000))return new Date(lm);return new Date()}
function parseLL(t){const m=String(t||'').match(/(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)/);if(!m)return null;
 const a=parseFloat(m[1].replace(',','.')),b=parseFloat(m[2].replace(',','.'));return Math.abs(a)<=90&&Math.abs(b)<=180?{lat:a,lon:b}:null}
function rows(file,real,pv,ex){
 if(pv)ex=mode==='normal'?{alt:'otomatis (GPS)',arah:'otomatis (kompas)'}:{alt:$('ket').value.trim()||'otomatis',arah:$('arah').value.trim()||(mode==='kamera'?'otomatis (kompas)':'')};
 const r=[],j=$('judul').value.trim();let koor,alamat,tgl,ll=null;
 if(mode==='normal'){
  const c=(real&&real.c)||lastPos;if(c)ll={lat:c.latitude,lon:c.longitude};
  koor=real?real.koor:(lastPos?koorTxt(lastPos,1):'koordinat GPS asli');
  alamat=real?real.alamat:(lastAddr?lastAddr.t:'alamat asli dari GPS');
  tgl=pv?new Date():fileTime(file,1);
 }else{
  koor=$('koor').value.trim();alamat=$('alamat').value.trim();ll=parseLL(koor);
  const m=$('tglMode').value;
  tgl=m==='manual'&&$('tglVal').value?new Date($('tglVal').value):(m==='file'&&file?fileTime(file,0):new Date());
 }
 if($('tJudul').checked&&j)r.push({t:j,b:1});
 if($('tAlamat').checked&&alamat)r.push({t:alamat});
 if($('tKoor').checked&&koor)r.push({t:'📍 '+koor});
 if($('tWaktu').checked)r.push({t:'🕒 '+fmt(tgl)});
 const x2=[];
 if($('tKet').checked&&ex&&ex.alt!=null&&ex.alt!=='')x2.push('Ketinggian: '+fAlt(ex.alt));
 if($('tArah').checked&&ex&&ex.arah!=null&&ex.arah!=='')x2.push('Arah: '+fArah(ex.arah));
 if(x2.length)r.push({t:x2.join('   •   ')});
 return {r,ll};
}
let pvT;function preview(){clearTimeout(pvT);pvT=setTimeout(()=>{const r=rows(null,null,1).r;$('pr').textContent=r.length?r.map(x=>x.t).join('\n'):'(watermark kosong)'},150)}

/* ---------- gambar ---------- */
function wrap(x,text,maxW){const out=[];text.split('\n').forEach(par=>{let l='';par.split(' ').forEach(w=>{const t=l?l+' '+w:w;if(x.measureText(t).width>maxW&&l){out.push(l);l=w}else l=t});out.push(l)});return out}
const rr=(x,X,Y,W,H,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()};
const TILE={osm:(z,X,Y)=>'https://tile.openstreetmap.org/'+z+'/'+X+'/'+Y+'.png',sat:(z,X,Y)=>'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+Y+'/'+X};
const ATTR={osm:'© OpenStreetMap',sat:'Esri'};
function loadImg(u){return new Promise(ok=>{const i=new Image();i.crossOrigin='anonymous';const t=setTimeout(()=>{i.src='';ok(null)},7000);i.onload=()=>{clearTimeout(t);ok(i)};i.onerror=()=>{clearTimeout(t);ok(null)};i.src=u})}
let mapCache={k:'',c:null};
async function getMap(ll,z,st){
 const k=[ll.lat.toFixed(5),ll.lon.toFixed(5),z,st].join();
 if(mapCache.k===k&&mapCache.c)return mapCache.c;
 const W=300,n=Math.pow(2,z),sn=Math.sin(ll.lat*Math.PI/180),
  px=(ll.lon+180)/360*n*256,py=(0.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*n*256,x0=px-W/2,y0=py-W/2,
  c=document.createElement('canvas');c.width=c.height=W;const g=c.getContext('2d');
 g.fillStyle='#cfd8dc';g.fillRect(0,0,W,W);
 let okN=0;const jobs=[];
 for(let tx=Math.floor(x0/256);tx<=Math.floor((x0+W)/256);tx++)for(let ty=Math.floor(y0/256);ty<=Math.floor((y0+W)/256);ty++){
  if(ty<0||ty>=n)continue;const X=((tx%n)+n)%n;
  jobs.push(loadImg(TILE[st](z,X,ty)).then(im=>{if(im){g.drawImage(im,tx*256-x0,ty*256-y0);okN++}}))}
 await Promise.all(jobs);
 if(!okN){toast('Peta gagal dimuat, periksa internet');return c}
 mapCache={k,c};return c;
}
async function drawPanel(x,w,h,inf){
 const rs=inf.r,showMap=$('tMap').checked&&inf.ll;
 if(!rs.length&&!showMap)return;
 const fs=Math.max(14,Math.round(Math.min(w,h)/34*parseFloat($('ukuran').value))),m=Math.round(fs*.6),p=Math.round(fs*.6),lh=Math.round(fs*1.3),S=Math.round(fs*5.2);
 const st=$('mapStyle').value,mp=showMap?await getMap(inf.ll,parseInt($('mapZoom').value),st):null;
 const tx=m+p+(mp?S+p:0),tw=w-m-p-tx,L=[];
 rs.forEach(r=>{x.font=(r.b?'bold ':'')+Math.round(r.b?fs*1.2:fs)+'px sans-serif';wrap(x,r.t,tw).forEach(t=>L.push({t,b:r.b}))});
 const th=L.length*lh,ih=Math.max(mp?S:0,th),H=ih+p*2,Y=$('posisi').value==='atas'?m:h-m-H;
 x.fillStyle='rgba(0,0,0,.5)';rr(x,m,Y,w-2*m,H,fs*.7);x.fill();
 if(mp){
  const X=m+p,Y2=Y+p,cx=X+S/2,cy=Y2+S/2,r=S*.06,af=Math.round(S*.055);
  x.save();rr(x,X,Y2,S,S,fs*.4);x.clip();x.drawImage(mp,X,Y2,S,S);
  x.fillStyle='#e53935';x.beginPath();x.arc(cx,cy-r*1.6,r,0,6.2832);x.fill();
  x.beginPath();x.moveTo(cx-r*.8,cy-r*1.1);x.lineTo(cx,cy);x.lineTo(cx+r*.8,cy-r*1.1);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(cx,cy-r*1.6,r*.4,0,6.2832);x.fill();
  x.font=af+'px sans-serif';x.textBaseline='top';const aw=x.measureText(ATTR[st]).width+af;
  x.fillStyle='rgba(255,255,255,.8)';x.fillRect(X,Y2+S-af*1.5,aw,af*1.5);x.fillStyle='#333';x.fillText(ATTR[st],X+af/2,Y2+S-af*1.3);
  x.restore();
 }
 x.fillStyle='#fff';x.textBaseline='top';const ty=Y+p+(ih-th)/2;
 L.forEach((l,i)=>{x.font=(l.b?'bold ':'')+Math.round(l.b?fs*1.2:fs)+'px sans-serif';x.fillText(l.t,tx,ty+i*lh)});
}
async function loadBmp(f){
 try{return await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){}
 return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u})}
async function makePhoto(f,real,ex){
 const b=await loadBmp(f),w0=b.width||b.naturalWidth,h0=b.height||b.naturalHeight,s=Math.min(1,MAXSIDE/Math.max(w0,h0)),w=Math.round(w0*s),h=Math.round(h0*s);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.drawImage(b,0,0,w,h);if(b.close)b.close();
 await drawPanel(x,w,h,rows(f,real,0,ex));
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));c.width=c.height=0;
 if(!blob)throw new Error('gagal membuat gambar');return blob;
}

/* ---------- simpan ---------- */
const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
async function saveBlob(blob){
 const name='GEO_'+localISO(new Date()).replace(/[-:T]/g,'')+'_'+Math.floor(Math.random()*900+100)+'.jpg';
 if(GS){await GS.savePhoto({data:await b64(blob),fileName:name});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function show(blob){
 if(lastUrl)URL.revokeObjectURL(lastUrl);lastBlob=blob;lastUrl=URL.createObjectURL(blob);lastSaved=false;
 $('hasil').src=lastUrl;$('hasil').style.display='block';$('kosong').style.display='none';
 $('btnSimpan').disabled=false;$('btnBagi').disabled=!(navigator.canShare);
}

/* ---------- alur utama ---------- */
function setBusy(b,t){busy=b;$('go').disabled=b;$('st').textContent=t||''}
async function handle(files){
 if(!files.length||busy)return;
 setBusy(true,'Menyiapkan…');
 let real=null;
 if(mode==='normal'){real=await Promise.race([pending||realData(),sleep(15000).then(()=>null)])||{koor:'GPS tidak tersedia',alamat:''}}
 let ex={alt:null,arah:null};
 if(mode==='normal'){ex.alt=real.alt;ex.arah=pendH}
 else{const ll=parseLL($('koor').value);
  ex.alt=$('ket').value.trim()||($('tKet').checked&&ll?await elevFor(ll):null);
  ex.arah=$('arah').value.trim()||(mode==='kamera'?pendH:null)}
 let ok=0,gagal='';
 for(let i=0;i<files.length;i++){
  setBusy(true,'Memproses '+(i+1)+'/'+files.length+'…');await sleep(30);
  try{const bl=await makePhoto(files[i],real,ex);show(bl);
   if($('auto').checked){await saveBlob(bl);lastSaved=true}ok++}
  catch(e){gagal=(e&&e.message)||String(e)}
 }
 setBusy(false,ok?(ok+' foto selesai'+($('auto').checked?(GS?' & tersimpan di galeri (Pictures/Kamera Geotag)':' & diunduh'):'')+'.'):'');
 toast(gagal?('Gagal: '+gagal):(ok+' foto selesai'));
}
$('go').onclick=async()=>{
 if(busy)return;
 if(mode==='galeri'){$('fGal').click();return}
 if(mode==='normal')pending=realData();
 pendH=null;
 if($('tArah').checked&&(mode==='normal'||!$('arah').value.trim())){
  $('go').disabled=true;$('st').textContent='Membaca arah kompas…';pendH=await readHeading(500);$('go').disabled=false;$('st').textContent='';
 }
 $('fCam').click();
};
['fCam','fGal'].forEach(id=>$(id).onchange=e=>{const f=[...e.target.files];e.target.value='';handle(f)});
$('btnSimpan').onclick=async()=>{
 if(!lastBlob)return;if(lastSaved){toast('Sudah tersimpan');return}
 try{await saveBlob(lastBlob);lastSaved=true;toast(GS?'Tersimpan di galeri':'Diunduh')}catch(e){toast('Gagal menyimpan: '+(e.message||e))}
};
$('btnBagi').onclick=async()=>{try{const f=new File([lastBlob],'geotag.jpg',{type:'image/jpeg'});if(navigator.canShare({files:[f]}))await navigator.share({files:[f]})}catch(e){}};
$('btnArah').onclick=async()=>{toast('Arahkan HP ke objek…');const h=await readHeading(600);if(h==null)toast('Kompas tidak tersedia, isi arah manual');else{$('arah').value=fArah(h);save();preview()}};
$('btnGps').onclick=cekGps;$('btnIsi').onclick=isiDariGps;

/* ---------- mode & tampilan ---------- */
const INFO={normal:'Foto langsung dari kamera dengan peta, koordinat GPS, alamat, dan waktu asli. Butuh GPS aktif; peta dan alamat butuh internet.',
 kamera:'Foto langsung dari kamera. Koordinat, alamat, dan tanggal diisi sendiri.',
 galeri:'Pilih satu atau banyak foto dari galeri, lalu beri watermark dengan koordinat, alamat, dan tanggal sendiri.'};
function setMode(m){
 mode=m;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 $('info').textContent=INFO[m];
 $('boxNormal').classList.toggle('h',m!=='normal');$('boxCustom').classList.toggle('h',m==='normal');
 $('go').textContent=m==='galeri'?'🖼️ Pilih dari Galeri':'📷 Ambil Foto';
 save();preview();
}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('tglMode').addEventListener('change',()=>{const m=$('tglMode').value==='manual';$('tglVal').classList.toggle('h',!m);if(m&&!$('tglVal').value)$('tglVal').value=localISO(new Date())});
document.querySelectorAll('input,select,textarea').forEach(e=>e.addEventListener('input',()=>{save();preview()}));
try{load()}catch(e){}
$('tglMode').dispatchEvent(new Event('change'));setMode(mode);
</script>
</body>
</html>
